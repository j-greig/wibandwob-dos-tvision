<!-- WebGL page template: no xterm.js. tools/bundle.py --shell web/shell-webgl.html fills the INLINE markers. -->
<title>WIBWOB-DOS</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #term { display: block; position: absolute; left: 0; top: 0; outline: none; cursor: none;
          image-rendering: pixelated; image-rendering: crisp-edges; }
  #boot { position: absolute; left: 16px; top: 16px; color: #aaa; font: 14px Menlo, Consolas, monospace; }
</style>
<canvas id="term" class="xterm-screen" tabindex="0"></canvas>
<div id="boot">loading WIBWOB-DOS...</div>
<!--INLINE_ATLAS-->
<script>
(function () {

    canvas.style.width = (cols * cellCssW) + 'px'; canvas.style.height = (rows * cellCssH) + 'px';
    canvas.style.left = Math.floor((w - cols * cellCssW) / 2) + 'px';
    canvas.style.top = Math.floor((h - rows * cellCssH) / 2) + 'px';

    wwdosWrite: function () {},           // ANSI mode-set sequences from TermIO: nothing to do here

    print: function (s) { console.log(s); },
