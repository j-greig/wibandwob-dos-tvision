<meta name="viewport" content="width=device-width, initial-scale=1">

<div id="boot">loading WIBWOB-DOS...</div>

  });

  window.wwdosTerm = {
    get cols() { return cols; }, get rows() { return rows; },
    buffer: { active: { getLine: function (y) { return { translateToString: function () {

    // every cell of the last grid as [codepoint|flags, fg, bg] (tests/stage/test_seek_play.py compares two of them)
    cells: function () { return last ? Array.from(last) : []; },
    // the engine's under-glyph list as it stands (seven numbers per cell, see "under" above)
    under: function () { return under ? Array.from(under) : []; }

  // Stage clock for tools: seek(S) applies at the next stage tick (within one clock period).
  window.wwdosStage = {
    time: function () { return M._wwdos_stage_time ? M._wwdos_stage_time() : 0; },
    seek: function (s) { if (M._wwdos_stage_seek) { M._wwdos_stage_seek(+s); wake(); } },
    // Tools: step(N) runs N ticks on a paused page, as playing would. served() counts the seeks and steps a paused
    // page has finished with its screen flushed: ask, then read the grid when the number moves.
    step: function (n) { if (M._wwdos_stage_step) { M._wwdos_stage_step(n | 0); wake(); } },
    served: function () { return M._wwdos_stage_served ? M._wwdos_stage_served() : -1; },
    length: function () { return M._wwdos_stage_length ? M._wwdos_stage_length() : 0; },
    // The tick on screen, in seconds. While playing, time() is one tick ahead of it; after a seek they are equal.
    shown: function () { return M._wwdos_stage_shown ? M._wwdos_stage_shown() : this.time(); },
    waiting: function () { return !!(M._wwdos_stage_waiting && M._wwdos_stage_waiting()); },
    go: function () { if (M._wwdos_stage_go) M._wwdos_stage_go(); },
    // Playing a film live (docs/stage.md): bars count from bar 1 of the film (the stage's tempo command).
    bars: function () { return M._wwdos_stage_bars ? M._wwdos_stage_bars() : 0; },
    bar: function () { return M._wwdos_stage_bar ? M._wwdos_stage_bar() : 0; },
    jump: function (b) { if (M._wwdos_stage_jump) M._wwdos_stage_jump(+b); },
    quantise: function (m) {

    },
    queued: function () { return M._wwdos_stage_queued ? M._wwdos_stage_queued() : -1; },
    seekMs: function () { return M._wwdos_stage_seek_ms ? M._wwdos_stage_seek_ms() : 0; },
    // One stage command now, no time field: run('open t 2 2 20 5 cyan |hello'). Returns '' or the reason it cannot
    // run. The window is a stage window: the next seek or replay closes it. lastError(): why the last applied
    // command did nothing. pause(on): true pauses, false plays, no argument asks; returns true when paused.
    run: function (line) { return M.ccall ? M.ccall('wwdos_stage_run', 'string', ['string'], [String(line)]) : 'the app is not up yet'; },
    lastError: function () { return M.ccall ? M.ccall('wwdos_stage_live_error', 'string', [], []) : ''; },
    // The stage's windows, front first: [{name, x, y, w, h, ghost, title, file}] in desktop cells. screen(): the
    // grid as text rows (row 0 is the menu bar). With run() these are the three verbs of the live bridge.
    windows: function () { try { return JSON.parse(M.ccall('wwdos_stage_windows', 'string', [], [])); } catch (e) { return []; } },
    screen: function () { var o = [], b = window.wwdosTerm.buffer.active; for (var y = 0; y < window.wwdosTerm.rows; y++) o.push(b.getLine(y).translateToString()); return o; },
    pause: function (on) { return M._wwdos_stage_pause ? !!M._wwdos_stage_pause(on === undefined ? -1 : on ? 1 : 0) : false; },
    sectionsList: function () { return (window.wwdosSections || []).map(function (s) { return { name: s.name, bar: s.bar, time: s.time }; }); },
    audio: function () { return actx ? { now: actx.currentTime, base: clipBase, state: actx.state } : null; },
    // The open log (docs/stage.md § The open log): every live line the page ran, with the tick it ran on and the
    // script position. log() -> [{tick, pos, t, line}]; record(on) keeps it through seeks and loops (an overdub);
    // clearLog(); restore(LOG) replaces it (the array log() gives, or "TICK POS LINE" rows) and rebuilds the desktop.
    log: function () {

    record: function (on) { return M._wwdos_stage_record ? !!M._wwdos_stage_record(on === undefined ? -1 : on ? 1 : 0) : false; },
    clearLog: function () { if (M._wwdos_stage_log_clear) M._wwdos_stage_log_clear(); },

  // {wwdos: 'time', t, length} posted back to the sender. It may also post {wwdos: 'run', line}, {wwdos: 'jump', bar},
  // {wwdos: 'log'}, {wwdos: 'record', on} and {wwdos: 'restore', log} are answered with {wwdos: 'log', recording, log}.
  // {wwdos: 'quantise', mode}, {wwdos: 'pause', on} or {wwdos: 'state'}; each is answered with
  // {wwdos: 'state', t, length, bar, bars, quantise, queued, paused, sections, error}. error is run()'s answer for a

    if ((d.wwdos === 'seek' || d.wwdos === 'time') && e.source) {

      return;
    }

      return;
    }
    if (d.wwdos === 'run') error = S.run(d.line === undefined ? '' : d.line);
    else if (d.wwdos === 'jump' && isFinite(+d.bar)) S.jump(+d.bar);
    else if (d.wwdos === 'quantise') S.quantise(d.mode);
    else if (d.wwdos === 'pause') S.pause(d.on === undefined ? !S.pause() : !!d.on);
    else if (d.wwdos === 'log' || d.wwdos === 'record' || d.wwdos === 'restore') {

      if (d.wwdos === 'restore') S.restore(d.log);

})();
